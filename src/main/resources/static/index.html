<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>볼타클럽 | 내전 전적 포탈</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>

    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        /* 💡 통합 컬러 팔레트 (CSS 변수) */
        :root {
            /* Light Mode (기본값) */
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --nav-bg: rgba(255, 255, 255, 0.9);
            --input-bg: #f8fafc;
            --chat-msg-bg: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(0, 0, 0, 0.08);
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --win-color: #059669;
            --lose-color: #e11d48;
            --draw-color: #64748b;
            --gold: #d97706;
            --team-win-bg: linear-gradient(90deg, rgba(16, 185, 129, 0.05), transparent);
            --team-lose-bg: linear-gradient(90deg, rgba(225, 29, 72, 0.05), transparent);
            --is-me-bg: rgba(37, 99, 235, 0.08);
            --admin-box-bg: rgba(239, 68, 68, 0.03);
            --tab-active-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            /* Dark Mode */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.85);
            --nav-bg: rgba(15, 23, 42, 0.9);
            --input-bg: #0f172a;
            --chat-msg-bg: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --win-color: #34d399;
            --lose-color: #fb7185;
            --draw-color: #94a3b8;
            --gold: #fbbf24;
            --team-win-bg: linear-gradient(90deg, rgba(52, 211, 153, 0.05), transparent);
            --team-lose-bg: linear-gradient(90deg, rgba(251, 113, 133, 0.05), transparent);
            --is-me-bg: rgba(59, 130, 246, 0.15);
            --admin-box-bg: rgba(255, 255, 255, 0.03);
            --tab-active-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg-gradient); color: var(--text-main); margin: 0; padding: 0; min-height: 100vh; transition: background 0.3s, color 0.3s; }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        [data-theme="dark"] ::-webkit-scrollbar-thumb { background: #475569; }

        .navbar { background: var(--nav-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.03); transition: background 0.3s, border-color 0.3s;}
        .nav-logo { font-size: 1.5rem; font-weight: 900; color: var(--text-main); display: flex; align-items: center; gap: 10px; } .nav-logo span { color: var(--primary); }
        .nav-links { display: flex; gap: 15px; align-items: center;}
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 8px; transition: 0.2s; background: rgba(128,128,128,0.05); }
        .nav-links a:hover { color: var(--primary); background: rgba(59,130,246,0.1); }
        .btn-fconline { background: #00194b !important; color: white !important; border: 1px solid #1a3673 !important; }

        /* 💡 테마 토글 버튼 스타일 */
        .btn-theme { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); font-size: 16px; padding: 6px 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;}
        .btn-theme:hover { background: var(--border-color); }

        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
        #notice-bar { display: none; background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; padding: 12px 20px; border-radius: 12px; margin-bottom: 25px; font-weight: bold; text-align: center; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        #login-section { max-width: 400px; margin: 100px auto; text-align: center; }
        .input-group { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }

        input, textarea { width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); font-size: 15px; outline: none; transition: 0.2s; font-family: 'Pretendard', sans-serif;}
        input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); background: var(--card-bg);}
        button.btn-main, button.btn-danger { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.2s; color: white; }
        button.btn-main { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); }
        button.btn-main:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(37, 99, 235, 0.4); }
        button.btn-danger { background: var(--lose-color); }

        .glass-card { background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 20px; padding: 25px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05); transition: background 0.3s, border-color 0.3s; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 350px; gap: 30px; align-items: start; }
        @media (max-width: 1024px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .tab-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; background: rgba(128,128,128,0.05); padding: 6px; border-radius: 14px; }
        .tab-btn { flex: 1; min-width: 120px; padding: 12px; border-radius: 10px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: 0.3s; }
        .tab-btn:hover { color: var(--text-main); background: rgba(128,128,128,0.1); }
        .tab-btn.active { background: var(--card-bg); color: var(--primary); box-shadow: var(--tab-active-shadow); }

        table { width: 100%; border-collapse: collapse; text-align: center; }
        th { color: var(--text-muted); padding: 15px; border-bottom: 2px solid var(--border-color); font-size: 13px; letter-spacing: 1px; }
        td { padding: 18px 15px; border-bottom: 1px solid var(--border-color); font-size: 15px; font-weight: 500; }
        tr:hover td { background: rgba(128,128,128,0.05); }
        .pts-column { color: var(--primary); font-size: 1.2rem; font-weight: 900; }

        .admin-only { display: none; margin-top: 30px; padding: 20px; background: var(--admin-box-bg); border: 2px dashed #ff4d4f; border-radius: 16px; }

        .chat-container { display: flex; flex-direction: column; height: 600px; padding: 20px; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;}
        #chat-window { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 10px; margin-bottom: 15px;}
        .chat-msg { background: var(--chat-msg-bg); padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; border-left: 3px solid var(--primary); color: var(--text-main);}
        .chat-input-wrapper { display: flex; gap: 10px; }
        .chat-input-wrapper input { padding: 12px; margin: 0; flex: 1;}
        .chat-input-wrapper button { width: 80px; padding: 12px; }

        /* 멤버 소개 UI */
        .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .member-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; text-align: center; position: relative; transition: 0.3s; transform-style: preserve-3d; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .member-card:hover { border-color: var(--primary); box-shadow: 0 10px 25px rgba(37, 99, 235, 0.15); }
        .member-pos { display: inline-block; padding: 4px 10px; background: rgba(37, 99, 235, 0.1); color: var(--primary); border-radius: 20px; font-size: 12px; font-weight: 900; margin-bottom: 12px; }
        .member-name { font-size: 1.3rem; font-weight: 800; margin-bottom: 10px; transform: translateZ(20px); }
        .member-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; transform: translateZ(10px); }
        .btn-delete-member { position: absolute; top: 10px; right: 10px; background: var(--lose-color); color: white; border: none; border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; display: none; transform: translateZ(30px); }

        /* 카테고리/게시판 */
        .category-bar { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 10px; }
        .cat-wrapper { position: relative; display: inline-block; cursor: grab; }
        .cat-wrapper.sortable-ghost { opacity: 0.4; }
        .category-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-muted); font-weight: bold; cursor: pointer; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.02);}
        .category-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .cat-delete-btn { position: absolute; top: -5px; right: -5px; background: var(--lose-color); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; padding: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .board-post-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; align-items: center;}
        .board-post-row:hover { background: rgba(128,128,128,0.05); }
        .post-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .post-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 15px; align-items: center;}
        .post-content-view { background: var(--input-bg); padding: 20px; border-radius: 12px; margin-top: 10px; display: none; border: 1px solid var(--border-color); font-size: 14px; line-height: 1.6; color: var(--text-main);}

        /* 💡 전적 카드 */
        .match-card { background: var(--card-bg); border-radius: 16px; margin-bottom: 25px; overflow: hidden; border: 1px solid var(--border-color); transform-style: preserve-3d; box-shadow: 0 5px 20px rgba(0,0,0,0.04); }
        .match-header { background: var(--input-bg); padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .header-left { flex: 1; text-align: left; }
        .header-center { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .header-right { flex: 1; text-align: right; }

        .match-teams { display: grid; grid-template-columns: 1fr 1fr; }
        @media (max-width: 768px) { .match-teams { grid-template-columns: 1fr; } }

        .team-box { padding: 20px; }
        .team-box.win { background: var(--team-win-bg); border-left: 5px solid var(--win-color); }
        .team-box.lose { background: var(--team-lose-bg); border-left: 5px solid var(--lose-color); }
        .team-box.draw { border-left: 5px solid var(--draw-color); }

        .team-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 15px; color: var(--text-muted); }
        .win .team-title { color: var(--win-color); } .lose .team-title { color: var(--lose-color); }

        .player-row { display: grid; grid-template-columns: 3fr 1fr 2fr; align-items: center; padding: 8px 10px; border-radius: 8px; margin-bottom: 5px; font-size: 14px; transition: 0.2s;}
        .player-row:hover { background: rgba(128,128,128,0.05); }
        .player-row.is-me { background: var(--is-me-bg); border: 1px solid rgba(37, 99, 235, 0.2); }

        .p-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .p-rating { color: var(--gold); font-weight: 900; text-align: center; }
        .p-stats { color: var(--text-muted); text-align: right; display: flex; justify-content: flex-end; gap: 10px;}
    </style>
</head>
<body>

<div class="navbar" id="top-nav" style="display:none;">
    <div class="nav-logo">⚽ VOLTA<span>CLUB</span></div>
    <div class="nav-links">
        <a href="https://www.youtube.com/@welcomevolta" target="_blank">📺 유튜브</a>
        <a href="https://discord.gg/cPeJNTEgWU" target="_blank">👾 디스코드</a>
        <a href="https://open.kakao.com/o/gO6ji4ye" target="_blank">💬 카톡</a>
        <a href="https://fconline.nexon.com/main/index" target="_blank" class="btn-fconline">FC 공식홈</a>
        <button id="theme-btn" class="btn-theme" onclick="toggleTheme()" title="다크/라이트 모드 전환">☀️</button>
        <button onclick="logout()" style="background:transparent; border:1px solid #ef4444; color:#ef4444; padding:6px 12px; border-radius:8px; cursor:pointer;">로그아웃</button>
    </div>
</div>

<div class="container">
    <div id="notice-bar">📢 <span id="notice-text"></span></div>

    <div id="login-section" class="glass-card">
        <h1 style="margin-top:0; font-size:2rem; color: var(--text-main);">⚽ VOLTA <span style="color:var(--primary)">CLUB</span></h1>
        <p style="color:var(--text-muted); font-size:14px; margin-bottom:30px;">포탈에 입장하기 위해 닉네임을 입력하세요</p>
        <div class="input-group">
            <input type="text" id="nickInput" placeholder="FC온라인 닉네임" onkeypress="if(event.key==='Enter') guestLogin()">
            <button class="btn-main" onclick="guestLogin()">포탈 입장하기</button>
        </div>
        <div style="margin: 25px 0; display:flex; align-items:center; color:var(--text-muted); font-size:12px;">
            <div style="flex:1; height:1px; background:var(--border-color);"></div><span style="padding:0 10px; font-weight:bold;">ADMIN</span><div style="flex:1; height:1px; background:var(--border-color);"></div>
        </div>
        <div class="input-group">
            <input type="text" id="adminId" placeholder="관리자 ID">
            <input type="password" id="adminPw" placeholder="비밀번호" onkeypress="if(event.key==='Enter') adminLogin()">
            <button class="btn-main" style="background:#475569;" onclick="adminLogin()">운영진 로그인</button>
        </div>
    </div>

    <div id="main-content" style="display:none;">
        <div class="dashboard-grid">

            <div class="left-section">
                <div class="tab-container">
                    <button id="btn-tab-volta" class="tab-btn active" onclick="switchTab('volta')">🔍 전적 검색</button>
                    <button id="btn-tab-members" class="tab-btn" onclick="switchTab('members')">👥 멤버 소개</button>
                    <button id="btn-tab-board" class="tab-btn" onclick="switchTab('board')">📝 클럽 게시판</button>
                    <button id="btn-tab-leaderboard" class="tab-btn" onclick="switchTab('leaderboard')">🏆 순위/운영</button>
                </div>

                <div id="tab-volta" class="glass-card">
                    <div style="display: flex; gap: 10px; margin-bottom: 25px;">
                        <input type="text" id="voltaSearchInput" placeholder="FC온라인 닉네임 검색" style="flex:1;" onkeypress="if(event.key==='Enter') searchVolta()">
                        <button class="btn-main" style="width:100px; padding:0;" onclick="searchVolta()">검색</button>
                    </div>
                    <div id="voltaResultContainer"><div style="text-align:center; padding: 60px 0; color:var(--text-muted);"><span style="font-size:3rem; display:block; margin-bottom:15px;">🎮</span>최근 20경기 4v4 스탯이 분석됩니다.</div></div>
                </div>

                <div id="tab-members" class="glass-card" style="display:none;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <h2 style="margin:0; color: var(--text-main);">👥 어서와 멤버를 소개합니다!</h2>
                    </div>
                    <p style="color:var(--text-muted); font-size:14px; margin-top:0;">우리 클럽의 자랑스러운 멤버들입니다.</p>

                    <div class="admin-only" style="margin-bottom:20px; padding:20px; background:var(--card-bg); border:1px solid var(--primary); border-radius:12px; box-shadow: 0 4px 12px rgba(37,99,235,0.05);">
                        <h4 style="margin:0 0 15px 0; color:var(--primary);">➕ 멤버 추가 (운영진)</h4>
                        <div style="display:flex; gap:10px; margin-bottom:10px;">
                            <input type="text" id="newMemNick" placeholder="닉네임" style="flex:1;">
                            <input type="text" id="newMemPos" placeholder="주 포지션 (예: ST)" style="flex:1;">
                        </div>
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="newMemDesc" placeholder="한줄평 소개" style="flex:3;">
                            <button class="btn-main" style="flex:1; padding:0;" onclick="addMember()">등록하기</button>
                        </div>
                    </div>
                    <div id="membersGrid" class="members-grid"></div>
                </div>

                <div id="tab-board" class="glass-card" style="display:none;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <div class="category-bar" id="categoryBar" style="flex:1; margin-bottom:0;"></div>
                        <button class="btn-main" style="width:120px; padding:10px; margin-left:15px;" onclick="toggleWriteForm()">✍️ 글쓰기</button>
                    </div>

                    <div class="admin-only" style="display:flex; gap:10px; margin-bottom:20px; background:var(--card-bg); padding:15px; border-radius:12px; border: 1px solid var(--border-color);">
                        <input type="text" id="newCatName" placeholder="새로운 게시판 탭 이름" style="flex:1;">
                        <button class="btn-main" style="width:100px; padding:0;" onclick="addCategory()">탭 생성</button>
                    </div>

                    <div id="writeForm" style="display:none; background:var(--card-bg); padding:20px; border-radius:12px; border:1px solid var(--border-color); margin-bottom:20px; box-shadow: 0 5px 15px rgba(0,0,0,0.03);">
                        <input type="text" id="postTitle" placeholder="제목을 입력하세요" style="margin-bottom:10px;">
                        <textarea id="postContent" placeholder="내용을 입력하세요" rows="5" style="margin-bottom:10px; resize:vertical;"></textarea>
                        <div style="display:flex; gap:10px; justify-content:flex-end;">
                            <button class="btn-danger" style="width:100px; padding:10px;" onclick="toggleWriteForm()">취소</button>
                            <button class="btn-main" style="width:100px; padding:10px;" onclick="addPost()">등록</button>
                        </div>
                    </div>
                    <div id="postListContainer" style="border-top:1px solid var(--border-color);"></div>
                </div>

                <div id="tab-leaderboard" class="glass-card" style="display:none;">
                    <div class="leaderboard-wrapper">
                        <table>
                            <thead><tr><th>RANK</th><th>TEAM</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>GF</th><th>PTS</th></tr></thead>
                            <tbody id="leaderboardBody"></tbody>
                        </table>
                    </div>
                    <div id="admin-tab" class="admin-only" style="margin-top:40px;">
                        <h3 style="color:var(--lose-color); border-bottom:1px solid var(--border-color); padding-bottom:10px; margin-top:0;">🛠️ 내전 어드민 도구</h3>
                        <div style="margin-bottom: 20px;"><h4 style="margin:0 0 10px 0; color:var(--text-main);">🚩 신규 팀 등록</h4><div style="display: flex; gap:10px"><input type="text" id="newTeamName" placeholder="팀 이름 입력"><button class="btn-main" style="width:100px; padding:0;" onclick="createTeam()">생성</button></div></div>
                        <div style="display:flex; gap:10px; margin-bottom:20px;"><button class="btn-main" style="flex:1; background:#059669;" onclick="genSchedule()">📅 대진표 자동생성</button><button class="btn-danger" style="flex:1;" onclick="resetAll()">⚠️ 전적 초기화</button></div>
                        <div id="matchList"></div>
                    </div>
                </div>

            </div>

            <div class="right-section">
                <div class="glass-card chat-container">
                    <div class="chat-header"><h3 style="margin:0; font-size:1.1rem; display:flex; align-items:center; gap:8px; color:var(--text-main);">💬 라이브 채팅 <span style="width:8px; height:8px; background:var(--lose-color); border-radius:50%; box-shadow:0 0 8px var(--lose-color);"></span></h3><span id="userDisplay" style="font-size:12px; color:var(--primary); font-weight:bold;"></span></div>
                    <div id="chat-window"></div>
                    <div class="chat-input-wrapper">
                        <input type="text" id="chatInput" placeholder="메시지 입력..." onkeypress="if(event.key==='Enter') sendMsg()">
                        <button class="btn-main" onclick="sendMsg()">전송</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    let socket; let myNickname = ""; let myColor = ""; let myRole = "GUEST";
    const IS_LOCAL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const SERVER_URL = IS_LOCAL ? "localhost:8080" : "game-club-service.onrender.com";
    const API_BASE = IS_LOCAL ? `http://${SERVER_URL}` : `https://${SERVER_URL}`;

    let currentCategoryId = null;

    // 💡 테마 전환 및 아이콘 업데이트 함수
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeButton();
    }

    function updateThemeButton() {
        const btn = document.getElementById('theme-btn');
        if(btn) {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            btn.innerText = currentTheme === 'dark' ? '☀️' : '🌙';
        }
    }

    // 로드 시 버튼 아이콘 업데이트
    window.addEventListener('DOMContentLoaded', updateThemeButton);

    function getUniqueColor(nickname) {
        let sum = 0; for (let i = 0; i < nickname.length; i++) sum += nickname.charCodeAt(i);
        return `hsl(${(sum * 137.5) % 360}, 60%, 45%)`; // 라이트모드에 맞게 채도/명도 조절
    }

    function switchTab(tabName) {
        ['volta', 'members', 'board', 'leaderboard'].forEach(name => {
            document.getElementById(`tab-${name}`).style.display = name === tabName ? 'block' : 'none';
            document.getElementById(`btn-tab-${name}`).classList.toggle('active', name === tabName);
        });
        if(tabName === 'members') loadMembers();
        if(tabName === 'board' && !currentCategoryId) loadCategories();
    }

    // ==========================================
    // 👥 멤버 소개 (Tilt 적용)
    // ==========================================
    async function loadMembers() {
        try {
            const res = await fetch(`${API_BASE}/api/community/members`);
            const members = await res.json();
            const isAdmin = (myRole === 'ADMIN');
            document.getElementById('membersGrid').innerHTML = members.map(m => `
                <div class="member-card" data-tilt data-tilt-max="5" data-tilt-glare data-tilt-max-glare="0.1">
                    <button class="btn-delete-member" style="display: ${isAdmin ? 'block' : 'none'};" onclick="deleteMember(${m.id})">삭제</button>
                    <div class="member-pos">${m.position}</div>
                    <div class="member-name">${m.nickname}</div>
                    <div class="member-desc">"${m.description}"</div>
                </div>
            `).join('');

            if(typeof VanillaTilt !== 'undefined') {
                VanillaTilt.init(document.querySelectorAll(".member-card"));
            }
        } catch (e) { }
    }
    async function addMember() {
        const nick = document.getElementById('newMemNick').value.trim(); const pos = document.getElementById('newMemPos').value.trim(); const desc = document.getElementById('newMemDesc').value.trim();
        if(!nick || !pos || !desc) return alert("빈칸을 모두 채워주세요!");
        await fetch(`${API_BASE}/api/community/members?nickname=${encodeURIComponent(nick)}&position=${encodeURIComponent(pos)}&description=${encodeURIComponent(desc)}`, {method:'POST'});
        document.getElementById('newMemNick').value = ''; document.getElementById('newMemPos').value = ''; document.getElementById('newMemDesc').value = ''; loadMembers();
    }
    async function deleteMember(id) {
        if(confirm("정말 이 멤버를 삭제할까요?")) { await fetch(`${API_BASE}/api/community/members/${id}`, {method:'DELETE'}); loadMembers(); }
    }

    // ==========================================
    // 📝 게시판 카테고리
    // ==========================================
    let sortableInstance = null;

    async function loadCategories() {
        try {
            const res = await fetch(`${API_BASE}/api/community/categories`);
            const categories = await res.json();
            const bar = document.getElementById('categoryBar');
            const isAdmin = (myRole === 'ADMIN');

            bar.innerHTML = categories.map(c => `
                <div class="cat-wrapper" data-id="${c.id}">
                    <button class="category-btn" id="cat-btn-${c.id}" onclick="selectCategory(${c.id})">${c.name}</button>
                    ${isAdmin ? `<button class="cat-delete-btn" onclick="deleteCategory(${c.id}, event)">✖</button>` : ''}
                </div>
            `).join('');

            if(categories.length > 0 && !currentCategoryId) selectCategory(categories[0].id);
            else if (currentCategoryId) selectCategory(currentCategoryId);

            if(isAdmin) {
                if(sortableInstance) sortableInstance.destroy();
                sortableInstance = new Sortable(bar, {
                    animation: 150, ghostClass: 'sortable-ghost',
                    onEnd: function () {
                        const itemEls = bar.querySelectorAll('.cat-wrapper');
                        const newOrderIds = Array.from(itemEls).map(el => el.getAttribute('data-id'));
                        fetch(`${API_BASE}/api/community/categories/reorder`, {
                            method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(newOrderIds)
                        });
                    }
                });
            }
        } catch (e) { }
    }

    async function addCategory() {
        const name = document.getElementById('newCatName').value.trim(); if(!name) return;
        await fetch(`${API_BASE}/api/community/categories?name=${encodeURIComponent(name)}`, {method:'POST'});
        document.getElementById('newCatName').value = ''; loadCategories();
    }
    async function deleteCategory(id, event) {
        event.stopPropagation();
        if(confirm("해당 탭을 삭제하시겠습니까? (안에 있는 글도 모두 삭제됩니다!)")) {
            await fetch(`${API_BASE}/api/community/categories/${id}`, {method:'DELETE'});
            if(currentCategoryId === id) currentCategoryId = null; loadCategories();
        }
    }

    function selectCategory(id) {
        currentCategoryId = id;
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`cat-btn-${id}`);
        if(activeBtn) activeBtn.classList.add('active');
        loadPosts(id);
    }

    // ==========================================
    // 📝 게시글
    // ==========================================
    async function loadPosts(categoryId) {
        try {
            const res = await fetch(`${API_BASE}/api/community/posts?categoryId=${categoryId}`);
            const posts = await res.json();
            const container = document.getElementById('postListContainer');

            if(posts.length === 0) { container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">아직 작성된 글이 없습니다. 첫 글을 남겨보세요!</div>`; return; }

            container.innerHTML = posts.map(p => {
                const date = new Date(p.createdAt).toLocaleDateString();
                const canDelete = (myRole === 'ADMIN' || myNickname === p.authorNickname);
                const delBtnHtml = canDelete ? `<button class="btn-danger" style="padding:4px 8px; font-size:11px; width:auto;" onclick="deletePost(${p.id}, event)">삭제</button>` : '';

                return `
                <div style="border-bottom: 1px solid var(--border-color);">
                    <div class="board-post-row" onclick="document.getElementById('post-content-${p.id}').style.display = document.getElementById('post-content-${p.id}').style.display === 'block' ? 'none' : 'block'">
                        <div style="flex:1;">
                            <div class="post-title" style="color:var(--text-main);">${p.title}</div>
                            <div class="post-meta"><span>👤 ${p.authorNickname}</span><span>🕒 ${date}</span></div>
                        </div>
                        <div>${delBtnHtml}</div>
                    </div>
                    <div id="post-content-${p.id}" class="post-content-view">${p.content.replace(/\n/g, '<br>')}</div>
                </div>
                `;
            }).join('');
        } catch(e) { }
    }

    function toggleWriteForm() { const form = document.getElementById('writeForm'); form.style.display = form.style.display === 'none' ? 'block' : 'none'; }

    async function addPost() {
        if(!currentCategoryId) return alert("카테고리를 먼저 선택해주세요!");
        const title = document.getElementById('postTitle').value.trim(); const content = document.getElementById('postContent').value.trim();
        if(!title || !content) return alert("제목과 내용을 입력해주세요.");
        await fetch(`${API_BASE}/api/community/posts?categoryId=${currentCategoryId}&title=${encodeURIComponent(title)}&content=${encodeURIComponent(content)}&authorNickname=${encodeURIComponent(myNickname)}`, {method:'POST'});
        document.getElementById('postTitle').value = ''; document.getElementById('postContent').value = ''; toggleWriteForm(); loadPosts(currentCategoryId);
    }
    async function deletePost(postId, event) {
        event.stopPropagation();
        if(confirm("정말 이 글을 삭제하시겠습니까?")) {
            const res = await fetch(`${API_BASE}/api/community/posts/${postId}?nickname=${encodeURIComponent(myNickname)}&role=${encodeURIComponent(myRole)}`, {method:'DELETE'});
            if(res.ok) { const text = await res.text(); if(text === 'forbidden') alert("권한이 없습니다!"); else loadPosts(currentCategoryId); }
        }
    }

    // ==========================================
    // 💡 볼타 전적 검색 (시간 KST 보정 + 라이트모드 3D)
    // ==========================================
    async function searchVolta() {
        const nickname = document.getElementById('voltaSearchInput').value.trim();
        if(!nickname) return alert("검색할 닉네임을 입력해주세요!");

        const container = document.getElementById('voltaResultContainer');
        container.innerHTML = '<div style="text-align:center; padding: 60px 0;"><div style="width:40px; height:40px; border:4px solid var(--primary); border-top:4px solid transparent; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 15px;"></div><p style="color:var(--text-muted);">넥슨 서버 통신 중... (최대 20경기)</p></div><style>@keyframes spin{100%{transform:rotate(360deg);}}</style>';

        try {
            const res = await fetch(`${API_BASE}/api/volta/recent?nickname=${encodeURIComponent(nickname)}`);
            if (!res.ok) { container.innerHTML = `<p style="color:var(--lose-color); text-align:center; padding:40px;">❌ 경기 기록을 찾을 수 없습니다.</p>`; return; }

            const matchDataArray = await res.json();
            if(!matchDataArray || matchDataArray.length === 0) { container.innerHTML = `<p style="color:var(--lose-color); text-align:center; padding:40px;">❌ 스탯이 존재하지 않습니다.</p>`; return; }

            let htmlStr = "";
            matchDataArray.forEach((data, index) => {
                const info = data.matchInfo;
                if(!info || info.length < 8) return;

                // 📅 🚨 시간대 9시간 오차 (KST) 완벽 보정!
                let dateStr = "날짜 정보 없음";
                if(data.matchDate) {
                    let nexonTime = data.matchDate;
                    if (!nexonTime.endsWith('Z')) nexonTime += 'Z'; // UTC 마크 강제 추가
                    const d = new Date(nexonTime);
                    dateStr = `${d.getMonth()+1}월 ${d.getDate()}일 ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
                }

                // 💡 최강 정밀 팀 분리 로직
                let teamA = [], teamB = [];
                let winners = info.filter(p => p.matchDetail && p.matchDetail.matchResult === '승');
                let losers = info.filter(p => p.matchDetail && (p.matchDetail.matchResult === '패' || p.matchDetail.matchResult === '하한'));

                if (winners.length === 4 && losers.length === 4) {
                    teamA = winners;
                    teamB = losers;
                } else {
                    let teamMap = {};
                    info.forEach(p => {
                        let d = p.matchDetail;
                        let sig = d ? `${d.possession}_${d.cornerKick}_${d.foul}` : Math.random();
                        if(!teamMap[sig]) teamMap[sig] = [];
                        teamMap[sig].push(p);
                    });

                    let sortedTeams = Object.values(teamMap).sort((a,b) => b.length - a.length);

                    if (sortedTeams.length >= 2 && sortedTeams[0].length === 4 && sortedTeams[1].length === 4) {
                        teamA = sortedTeams[0];
                        teamB = sortedTeams[1];
                    } else {
                        teamA = info.slice(0, 4);
                        teamB = info.slice(4, 8);
                    }
                }

                const sumGoals = (team) => team.reduce((s, p) => s + (p.player?.[0]?.status?.goal || 0), 0);
                const goalsA = sumGoals(teamA);
                const goalsB = sumGoals(teamB);

                let myTeam, oppTeam, myScore, oppScore;
                const isMeInA = teamA.some(p => p.nickname.toLowerCase() === nickname.toLowerCase());

                if(isMeInA) { myTeam = teamA; oppTeam = teamB; myScore = goalsA; oppScore = goalsB; }
                else { myTeam = teamB; oppTeam = teamA; myScore = goalsB; oppScore = goalsA; }

                const resultText = (myScore > oppScore) ? "WIN" : (myScore < oppScore) ? "LOSE" : "DRAW";
                const cardType = (myScore > oppScore) ? "win" : (myScore < oppScore) ? "lose" : "draw";
                const scoreColor = cardType === "win" ? "var(--win-color)" : (cardType === "lose" ? "var(--lose-color)" : "var(--draw-color)");

                const renderRows = (players) => {
                    return players.map(p => {
                        const s = p.player?.[0]?.status || {};
                        const isMe = p.nickname.toLowerCase() === nickname.toLowerCase();
                        return `<div class="player-row ${isMe ? 'is-me' : ''}"><div class="p-name" style="color:var(--text-main);">${p.nickname}</div><div class="p-rating">⭐${(s.spRating||0).toFixed(1)}</div><div class="p-stats"><span title="골">⚽${s.goal||0}</span><span title="어시">👟${s.assist||0}</span><span title="태클">🛡️${s.tackle||0}</span></div></div>`;
                    }).join('');
                };

                htmlStr += `
                <div class="match-card" data-tilt data-tilt-max="1" data-tilt-glare data-tilt-max-glare="0.05">
                    <div class="match-header">
                        <div class="header-left"><span style="font-weight:900; opacity:0.5; font-size:12px; color:var(--text-main);">#MATCH ${index+1}</span></div>
                        <div class="header-center">
                            <div style="font-size:24px; font-weight:900; color:${scoreColor}; letter-spacing:2px;">${myScore} : ${oppScore}</div>
                            <div style="font-size:11px; font-weight:900; margin-top:4px; color:var(--text-muted);">${resultText}</div>
                        </div>
                        <div class="header-right"><span style="font-size:12px; color:var(--text-muted); font-weight:bold;">📅 ${dateStr}</span></div>
                    </div>
                    <div class="match-teams">
                        <div class="team-box ${cardType}">
                            <div class="team-title">MY TEAM</div>
                            ${renderRows(myTeam)}
                        </div>
                        <div class="team-box" style="border-left: 1px solid var(--border-color);">
                            <div class="team-title" style="justify-content: flex-end; text-align:right;">OPPONENT</div>
                            ${renderRows(oppTeam)}
                        </div>
                    </div>
                </div>`;
            });

            container.innerHTML = htmlStr;

            if(typeof VanillaTilt !== 'undefined') {
                VanillaTilt.init(document.querySelectorAll(".match-card"));
            }

        } catch (e) { container.innerHTML = `<p style="color:var(--lose-color); text-align:center; padding:40px;">❌ 통신 에러 발생!</p>`; }
    }

    // ==========================================
    // 채팅 및 기타 유틸
    // ==========================================
    function connectChat(nickname, role) {
        myNickname = nickname; myRole = role || "GUEST"; myColor = (myRole === 'ADMIN' || myNickname === '운영진') ? '#e11d48' : getUniqueColor(myNickname);
        socket = new WebSocket(`${IS_LOCAL ? 'ws' : 'wss'}://${SERVER_URL}/ws/chat?nickname=${encodeURIComponent(myNickname)}&role=${encodeURIComponent(myRole)}`);
        socket.onmessage = (e) => {
            const data = e.data; const win = document.getElementById('chat-window');
            if (data.startsWith("[USER_LIST]")) { document.getElementById('userDisplay').innerText = data.replace("[USER_LIST]", "접속중: "); return; }
            if (data === "[CLEAR_CHAT]") { win.innerHTML = ""; return; }
            if (data.startsWith("[NOTICE]")) { document.getElementById('notice-text').innerText = data.replace("[NOTICE]", ""); document.getElementById('notice-bar').style.display = 'block'; return; }
            const div = document.createElement('div'); div.className = 'chat-msg'; div.innerHTML = data; win.appendChild(div); win.scrollTop = win.scrollHeight;
        };
    }

    function sendMsg() {
        const input = document.getElementById('chatInput'); const val = input.value.trim();
        if (!val || !socket) return;
        if (val.startsWith("/") && (myNickname === "운영진" || myRole === "ADMIN")) socket.send(val);
        else socket.send(`<strong style="color:${myColor}">${myNickname}</strong>: ${val}`);
        input.value = '';
    }

    // 💡 타이브레이커 정렬 및 렌더링
    async function loadLeaderboard() {
        try {
            const res = await fetch(`${API_BASE}/teams?_t=${Date.now()}`);
            let teams = await res.json();

            // 🏆 타이브레이커 룰 적용 (다중 조건 정렬)
            teams.sort((a, b) => {
                // 1순위: 승점 (PTS) 높은 순
                if (b.totalPoints !== a.totalPoints) return b.totalPoints - a.totalPoints;

                // 2순위: 득실차 (GD = 득점 - 실점) 높은 순
                const gdA = (a.goalsFor || 0) - (a.goalsAgainst || 0);
                const gdB = (b.goalsFor || 0) - (b.goalsAgainst || 0);
                if (gdB !== gdA) return gdB - gdA;

                // 3순위: 다득점 (GF) 높은 순
                if ((b.goalsFor || 0) !== (a.goalsFor || 0)) return (b.goalsFor || 0) - (a.goalsFor || 0);

                // 4순위: 다승 (Wins) 높은 순
                if (b.wins !== a.wins) return b.wins - a.wins;

                // 5순위: 최소패 (Losses) 적은 순
                return a.losses - b.losses;
            });

            // 렌더링
            document.getElementById('leaderboardBody').innerHTML = teams.map((t, i) => {
                // 득실차 계산 및 UI 꾸미기 (양수면 + 붙이기)
                const gd = (t.goalsFor || 0) - (t.goalsAgainst || 0);
                const gdDisplay = gd > 0 ? `+${gd}` : gd;
                const gdColor = gd > 0 ? 'var(--win-color)' : (gd < 0 ? 'var(--lose-color)' : 'var(--text-muted)');

                return `<tr>
                    <td style="color:${i===0?'var(--gold)':(i===1?'#94a3b8':(i===2?'#b45309':'var(--text-main)'))}; font-weight:800; font-size:1.1rem;">
                        ${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}
                    </td>
                    <td style="font-weight:bold; color:var(--text-main);">${t.teamName}</td>
                    <td>${t.wins}</td>
                    <td>${t.draws}</td>
                    <td>${t.losses}</td>
                    <td style="font-weight:bold; color:${gdColor};">${gdDisplay}</td>
                    <td style="color:var(--text-muted);">${t.goalsFor || 0}</td>
                    <td class="pts-column">${t.totalPoints}</td>
                </tr>`;
            }).join('');
        } catch(e) {
            console.error("순위표 로딩 에러:", e);
        }
    }

    async function loadMatches() {
        if (document.activeElement && document.activeElement.closest('#matchList')) return;
        try {
            const res = await fetch(`${API_BASE}/matches?_t=${Date.now()}`); const matches = await res.json();
            const listDiv = document.getElementById('matchList'); listDiv.innerHTML = '<h4 style="margin:15px 0 10px 0; color:var(--text-main);">🏁 경기 결과 수정</h4>';
            matches.forEach(m => {
                const div = document.createElement('div');
                // 인라인 스타일 수정: background:white 대신 var(--card-bg) 사용
                div.style.cssText = "padding:15px; background:var(--card-bg); margin-bottom:10px; border-radius:10px; border:1px solid var(--border-color); display:flex; align-items:center; gap:10px; font-size:14px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);";
                div.innerHTML = `
                    <span style="font-weight:bold; color:var(--text-main); font-size:12px; padding:4px 8px; background:var(--input-bg); border-radius:6px;">${m.status === 'FINISHED' ? '종료' : '예정'}</span>
                    <b style="flex:1; color:var(--text-main);">${m.homeTeamName} vs ${m.awayTeamName}</b>
                    <input type="number" id="h-${m.id}" value="${m.homeScore}" style="width:60px; height:36px; font-size:16px; font-weight:bold; text-align:center; border-radius:8px;">
                    <span style="font-weight:bold; font-size:18px; color:var(--text-main);">:</span>
                    <input type="number" id="a-${m.id}" value="${m.awayScore}" style="width:60px; height:36px; font-size:16px; font-weight:bold; text-align:center; border-radius:8px;">
                    <button class="btn-main" onclick="updateResult('${m.id}')" style="width:auto; padding:8px 12px; font-size:14px; margin-left:5px;">반영</button>
                `;
                listDiv.appendChild(div);
            });
        } catch(e) {}
    }

    // 💡 팀 생성 비동기 처리(await) 완벽 적용
    async function createTeam() {
        const n = document.getElementById('newTeamName').value.trim();
        if (!n) return;

        try {
            const res = await fetch(`${API_BASE}/create-team?name=${encodeURIComponent(n)}`);
            const resultMsg = await res.text();

            await loadLeaderboard(); // 렌더링 끝날 때까지 기다림

            document.getElementById('newTeamName').value = '';
            alert(resultMsg);
        } catch (e) {
            console.error("팀 생성 중 에러 발생:", e);
        }
    }

    // 💡 경기 결과 업데이트 비동기 처리(await) 완벽 적용
    async function updateResult(id) {
        const h = document.getElementById(`h-${id}`).value;
        const a = document.getElementById(`a-${id}`).value;

        try {
            await fetch(`${API_BASE}/update-result?matchId=${id}&homeScore=${h}&awayScore=${a}`);
            await loadLeaderboard();
            setTimeout(() => alert("반영 완료"), 50);
        } catch (e) {
            console.error("결과 반영 중 에러 발생:", e);
        }
    }

    // ==========================================
    // 로그인
    // ==========================================
    async function checkAuth() {
        try {
            const res = await fetch(`${API_BASE}/api/me`);
            if (res.ok) {
                const user = JSON.parse(await res.text());
                if (user && user.nickname) {
                    document.getElementById('login-section').style.display = 'none'; document.getElementById('top-nav').style.display = 'flex'; document.getElementById('main-content').style.display = 'block';
                    if (user.role === 'ADMIN') document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                    else document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
                    connectChat(user.nickname, user.role); loadLeaderboard(); document.getElementById('voltaSearchInput').value = user.nickname;
                }
            }
        } catch (e) {}
    }

    async function guestLogin() { const n = document.getElementById('nickInput').value; if(!n) return; await fetch(`${API_BASE}/api/login/guest?nickname=${encodeURIComponent(n)}`, { method: 'POST' }); checkAuth(); }
    async function adminLogin() { const id = document.getElementById('adminId').value; const pw = document.getElementById('adminPw').value; const res = await fetch(`${API_BASE}/api/login/admin?loginId=${id}&password=${pw}`, { method: 'POST' }); if (res.ok) checkAuth(); else alert("정보 불일치"); }
    function logout() { fetch(`${API_BASE}/api/logout`, {method:'POST'}).then(()=>location.reload()); }
    async function resetAll() { if (confirm("데이터를 완전 초기화할까요?")) { await fetch(`${API_BASE}/reset-all`); location.reload(); } }
    async function genSchedule() { const res = await fetch(`${API_BASE}/generate-schedule`); alert(await res.text()); loadMatches(); }

    setInterval(() => { if (document.getElementById('main-content').style.display === 'block') { loadLeaderboard(); const adminTab = document.getElementById('admin-tab'); if (adminTab && adminTab.style.display === 'block') loadMatches(); } }, 5000);
    window.onload = checkAuth;
</script>
</body>
</html>
